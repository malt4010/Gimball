<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimbal AI Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #16213e;
        }
        header h1 { font-size: 16px; font-weight: 600; }
        .status-bar { display: flex; gap: 12px; font-size: 12px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 3px; }
        .dot-green { background: #4ade80; } .dot-red { background: #f87171; }
        .dot-orange { background: #fb923c; } .dot-gray { background: #6b7280; }

        .main { flex: 1; display: flex; overflow: hidden; }

        .video-area {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
            cursor: crosshair; overflow: hidden;
        }
        .video-area img {
            width: 100%; height: 100%; object-fit: contain;
        }
        .crosshair {
            position: absolute; pointer-events: none;
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,100,0.6);
            border-radius: 50%; transform: translate(-50%, -50%);
            transition: left 0.2s, top 0.2s;
        }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,100,0.4); }
        .crosshair::before { width: 1px; height: 30px; left: 50%; top: -5px; transform: translateX(-50%); }
        .crosshair::after { height: 1px; width: 30px; top: 50%; left: -5px; transform: translateY(-50%); }
        .hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); padding: 5px 12px;
            border-radius: 6px; font-size: 11px; color: #999;
        }

        .sidebar {
            width: 260px; background: #16213e; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            overflow-y: auto; flex-shrink: 0;
        }
        .sidebar h3 { font-size: 10px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; margin-bottom: 1px; }
        button, select { width: 100%; padding: 7px; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; }
        button { font-weight: 500; } button:hover { opacity: 0.85; }
        .btn-stop { background: #ef4444; color: white; }
        .btn-center { background: #3b82f6; color: white; }
        .btn-gimbal { background: #8b5cf6; color: white; }
        .btn-gimbal.connected { background: #22c55e; }
        select { background: #0f172a; color: #eee; border: 1px solid #334155; }
        input[type="text"] { width: 100%; padding: 7px; border: 1px solid #334155; border-radius: 5px; background: #0f172a; color: #eee; font-size: 12px; }
        input[type="range"] { width: 100%; accent-color: #3b82f6; }
        .state-badge { padding: 6px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: 600; }
        .state-idle { background: #374151; } .state-tracking { background: #166534; } .state-lost { background: #92400e; }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; }
        .source-group { display: flex; flex-direction: column; gap: 5px; }
        .source-row { display: flex; gap: 5px; }
        .source-row input { flex: 1; }
        .source-row button { width: auto; padding: 7px 12px; background: #22c55e; color: white; }
        .divider { border-top: 1px solid #1e293b; margin: 3px 0; }
        .toggle-row { display: flex; gap: 5px; }
        .toggle-btn { flex: 1; padding: 6px; border: 2px solid #334155; border-radius: 5px; background: transparent; color: #94a3b8; font-size: 11px; text-align: center; }
        .toggle-btn.active { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,0.1); }
        .slider-label { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 1px; }

        /* Direction indicator - compact */
        .direction-indicator {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            width: 70px; height: 70px; margin: 0 auto;
        }
        .dir-arrow {
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #334155; transition: color 0.15s;
        }
        .dir-arrow.active { color: #4ade80; }
        .dir-arrow.mild { color: #4ade8066; }
        .dir-center { font-size: 8px; color: #475569; }

        .log {
            flex: 1; overflow-y: auto; font-size: 9px;
            background: #0f172a; border-radius: 5px; padding: 5px;
            font-family: monospace; color: #64748b; min-height: 40px;
        }

        @media (max-width: 700px) {
            .main { flex-direction: column; }
            .sidebar { width: 100%; max-height: 200px; flex-direction: row; flex-wrap: wrap; gap: 6px; }
            .sidebar > * { flex: 1; min-width: 120px; }
            .log, .divider { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Gimbal AI Tracker</h1>
        <div class="status-bar">
            <span><span class="dot dot-gray" id="cam-dot"></span>Feed</span>
            <span><span class="dot dot-gray" id="gimbal-dot"></span>Gimbal</span>
            <span><span class="dot dot-gray" id="track-dot"></span>Track</span>
        </div>
    </header>
    <div class="main">
        <div class="video-area" id="video-area">
            <img id="feed" src="/video_feed" alt="No video">
            <div class="crosshair" id="crosshair"></div>
            <div class="hint" id="hint">Select a video source to begin</div>
        </div>
        <div class="sidebar">
            <h3>Video Source</h3>
            <div class="source-group">
                <select id="source-type" onchange="onSourceTypeChange()">
                    <option value="browser">Phone Browser Camera</option>
                    <option value="droidcam">DroidCam</option>
                    <option value="rtsp">RTSP / IP Camera</option>
                    <option value="hdmi">HDMI Capture</option>
                    <option value="usb">USB Webcam</option>
                    <option value="custom">Custom URL</option>
                </select>
                <div id="source-config"></div>
            </div>
            <div class="info-row">
                <span>FPS: <span id="fps-val">-</span></span>
                <span>Persons: <span id="person-count">0</span></span>
            </div>

            <div class="divider"></div>

            <h3>Gimbal</h3>
            <button class="btn-gimbal" id="btn-gimbal" onclick="send('connect_gimbal')">Connect Gimbal</button>

            <div class="divider"></div>

            <h3>Tracking</h3>
            <div class="state-badge state-idle" id="state-badge">IDLE</div>
            <div class="toggle-row">
                <button class="btn-stop" onclick="send('stop_tracking')">Stop</button>
                <button class="btn-center" onclick="send('center')">Center</button>
            </div>

            <div class="divider"></div>

            <h3>Gimbal Direction</h3>
            <div class="direction-indicator">
                <div></div>
                <div class="dir-arrow" id="dir-up">&#9650;</div>
                <div></div>
                <div class="dir-arrow" id="dir-left">&#9664;</div>
                <div class="dir-center" id="dir-center">&#9679;</div>
                <div class="dir-arrow" id="dir-right">&#9654;</div>
                <div></div>
                <div class="dir-arrow" id="dir-down">&#9660;</div>
                <div></div>
            </div>

            <div class="divider"></div>

            <h3>Framing</h3>
            <div class="slider-label"><span>Horizontal</span><span id="frame-x-val">Center</span></div>
            <input type="range" id="frame-x" min="-50" max="50" value="0" oninput="updateFraming()">
            <div class="slider-label"><span>Headroom</span><span id="frame-y-val">Up 15%</span></div>
            <input type="range" id="frame-y" min="-50" max="50" value="-15" oninput="updateFraming()">

            <div class="divider"></div>

            <h3>Axis Lock</h3>
            <div class="toggle-row">
                <div class="toggle-btn" id="lock-pan" onclick="toggleLock('pan')">Lock Pan</div>
                <div class="toggle-btn" id="lock-tilt" onclick="toggleLock('tilt')">Lock Tilt</div>
            </div>

            <div class="divider"></div>

            <h3>Log</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
    const feed = document.getElementById('feed');
    const hint = document.getElementById('hint');
    const stateBadge = document.getElementById('state-badge');
    const camDot = document.getElementById('cam-dot');
    const gimbalDot = document.getElementById('gimbal-dot');
    const trackDot = document.getElementById('track-dot');
    const fpsVal = document.getElementById('fps-val');
    const personCount = document.getElementById('person-count');
    const logEl = document.getElementById('log');
    const sourceType = document.getElementById('source-type');
    const sourceConfig = document.getElementById('source-config');
    const crosshair = document.getElementById('crosshair');
    const frameXSlider = document.getElementById('frame-x');
    const frameYSlider = document.getElementById('frame-y');
    const btnGimbal = document.getElementById('btn-gimbal');

    let ws = null, lockPan = false, lockTilt = false;

    function log(m) { logEl.textContent += new Date().toLocaleTimeString() + ' ' + m + '\n'; logEl.scrollTop = logEl.scrollHeight; }
    function send(action, extra) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ action, ...extra })); }
    function saveVal(k, v) { try { localStorage.setItem('g_' + k, v); } catch(e) {} }
    function loadVal(k, d) { try { return localStorage.getItem('g_' + k) || d; } catch(e) { return d; } }

    // --- Framing ---
    frameXSlider.value = loadVal('fx', '0');
    frameYSlider.value = loadVal('fy', '-15');
    function updateFraming() {
        const x = parseInt(frameXSlider.value), y = parseInt(frameYSlider.value);
        saveVal('fx', x); saveVal('fy', y);
        document.getElementById('frame-x-val').textContent = x === 0 ? 'Center' : x < 0 ? `Left ${-x}%` : `Right ${x}%`;
        document.getElementById('frame-y-val').textContent = y === 0 ? 'Center' : y < 0 ? `Up ${-y}%` : `Down ${y}%`;
        const rect = feed.getBoundingClientRect();
        crosshair.style.left = (rect.left + rect.width * (50 + x) / 100) + 'px';
        crosshair.style.top = (rect.top + rect.height * (50 + y) / 100) + 'px';
        send('set_framing', { offset_x: x / 100, offset_y: y / 100 });
    }
    updateFraming();
    window.addEventListener('resize', updateFraming);

    // --- Axis lock ---
    lockPan = loadVal('lp', 'false') === 'true';
    lockTilt = loadVal('lt', 'false') === 'true';
    if (lockPan) document.getElementById('lock-pan').classList.add('active');
    if (lockTilt) document.getElementById('lock-tilt').classList.add('active');
    function toggleLock(axis) {
        if (axis === 'pan') { lockPan = !lockPan; document.getElementById('lock-pan').classList.toggle('active'); saveVal('lp', lockPan); }
        else { lockTilt = !lockTilt; document.getElementById('lock-tilt').classList.toggle('active'); saveVal('lt', lockTilt); }
        send('set_locks', { lock_pan: lockPan, lock_tilt: lockTilt });
    }

    // --- Direction arrows ---
    function updateArrows(pan, tilt) {
        const t = 0.05, s = 0.3;
        const cls = (val, pos) => val * pos > t ? (Math.abs(val) > s ? 'dir-arrow active' : 'dir-arrow mild') : 'dir-arrow';
        document.getElementById('dir-left').className = cls(pan, -1);
        document.getElementById('dir-right').className = cls(pan, 1);
        document.getElementById('dir-up').className = cls(tilt, 1);
        document.getElementById('dir-down').className = cls(tilt, -1);
    }

    // --- Source ---
    let browserStream = null;
    let browserSendInterval = null;

    function onSourceTypeChange() {
        const t = sourceType.value; saveVal('st', t);
        // Stop browser camera if switching away
        if (t !== 'browser') stopBrowserCam();
        const c = {
            browser: '<button onclick="connectSource()">Start Phone Camera</button><p style="font-size:10px;color:#64748b;">Opens camera in this browser. OBS uses /clean_feed</p>',
            droidcam: `<div class="source-row"><input type="text" id="source-ip" placeholder="Phone IP" value="${loadVal('dip', '')}"><button onclick="connectSource()">Go</button></div>`,
            rtsp: `<div class="source-row"><input type="text" id="source-ip" placeholder="rtsp://IP:554/stream" value="${loadVal('ru', '')}"><button onclick="connectSource()">Go</button></div>`,
            hdmi: '<button onclick="connectSource()">Use HDMI</button>',
            usb: '<button onclick="connectSource()">Use Webcam</button>',
            custom: `<div class="source-row"><input type="text" id="source-ip" placeholder="URL" value="${loadVal('cu', '')}"><button onclick="connectSource()">Go</button></div>`,
        };
        sourceConfig.innerHTML = c[t] || '';
    }
    sourceType.value = loadVal('st', 'browser');
    onSourceTypeChange();

    function connectSource() {
        const t = sourceType.value, el = document.getElementById('source-ip');
        if (t === 'browser') { startBrowserCam(); return; }
        let src = '';
        if (t === 'droidcam') { const ip = el?.value.trim(); if (!ip) return; saveVal('dip', ip); src = 'http://' + ip + ':4747/video'; }
        else if (t === 'rtsp') { src = el?.value.trim(); if (!src) return; saveVal('ru', src); }
        else if (t === 'hdmi' || t === 'usb') { src = '0'; }
        else { src = el?.value.trim(); if (!src) return; saveVal('cu', src); }
        log('Connect: ' + src); hint.textContent = 'Connecting...';
        send('change_source', { source: src });
    }

    // --- Browser camera (WebSocket frame upload) ---
    async function startBrowserCam() {
        if (browserStream) { stopBrowserCam(); return; }
        try {
            browserStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false,
            });
            const vid = document.createElement('video');
            vid.srcObject = browserStream; vid.setAttribute('playsinline', '');
            vid.muted = true; await vid.play();
            await new Promise(r => { const c = () => vid.videoWidth > 0 ? r() : requestAnimationFrame(c); c(); });

            const canvas = document.createElement('canvas');
            canvas.width = 640; canvas.height = Math.round(vid.videoHeight / vid.videoWidth * 640);
            const ctx = canvas.getContext('2d');

            // Tell server to use WebSocket source
            send('change_source', { source: 'websocket' });

            log(`Camera: ${vid.videoWidth}x${vid.videoHeight} → ${canvas.width}x${canvas.height}`);
            hint.textContent = 'Camera active';
            camDot.className = 'dot dot-green';

            let count = 0;
            browserSendInterval = setInterval(() => {
                if (!ws || ws.readyState !== 1 || ws.bufferedAmount > 100000) return;
                ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                    if (blob && ws && ws.readyState === 1) { ws.send(blob); count++; }
                    if (count <= 3 || count % 50 === 0) hint.textContent = `Camera: ${count} frames`;
                }, 'image/jpeg', 0.7);
            }, 66); // ~15 FPS

            // Update button
            sourceConfig.innerHTML = '<button onclick="connectSource()" style="background:#ef4444;">Stop Camera</button><p style="font-size:10px;color:#64748b;">OBS: http://localhost:8080/clean_feed</p>';
        } catch(e) {
            log('Camera error: ' + e.message);
            hint.textContent = 'Camera denied';
            camDot.className = 'dot dot-red';
        }
    }

    function stopBrowserCam() {
        if (browserSendInterval) { clearInterval(browserSendInterval); browserSendInterval = null; }
        if (browserStream) { browserStream.getTracks().forEach(t => t.stop()); browserStream = null; }
        camDot.className = 'dot dot-gray';
    }

    // --- WebSocket ---
    function connectWS() {
        const p = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(p + '//' + location.host + '/ws');
        ws.onopen = () => {
            log('Connected');
            send('set_locks', { lock_pan: lockPan, lock_tilt: lockTilt });
            updateFraming();
            setInterval(() => send('get_status'), 300);
        };
        ws.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if (d.event === 'status') {
                const s = d.state || 'idle';
                stateBadge.textContent = s.toUpperCase();
                stateBadge.className = 'state-badge state-' + s;
                gimbalDot.className = 'dot ' + (d.gimbal_connected ? 'dot-green' : 'dot-red');
                btnGimbal.textContent = d.gimbal_connected ? 'Gimbal Connected' : 'Connect Gimbal';
                btnGimbal.className = 'btn-gimbal' + (d.gimbal_connected ? ' connected' : '');
                trackDot.className = 'dot ' + (s === 'tracking' ? 'dot-green' : s === 'lost' ? 'dot-orange' : 'dot-gray');
                fpsVal.textContent = d.fps || 0;
                camDot.className = 'dot ' + ((d.fps || 0) > 0 ? 'dot-green' : 'dot-gray');
                if (d.detections != null) personCount.textContent = d.detections;
                if ((d.fps || 0) > 0 && hint.textContent.includes('Connecting')) hint.textContent = 'Click on a person to track';
                if (d.gimbal_pan != null) updateArrows(d.gimbal_pan, d.gimbal_tilt);
            } else if (d.event === 'target_selected') {
                log(d.success ? 'Target locked!' : 'No person there');
                hint.textContent = d.success ? 'Tracking' : 'Click a person';
            } else if (d.event === 'tracking_stopped') { log('Stopped');
            } else if (d.event === 'source_changed') { log('Source: ' + d.source);
            } else if (d.event === 'gimbal_status') { log('Gimbal: ' + d.message); }
        };
        ws.onclose = () => setTimeout(connectWS, 2000);
    }

    // --- Click to track ---
    document.getElementById('video-area').addEventListener('click', (e) => {
        const rect = feed.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) / rect.width * (feed.naturalWidth || 640));
        const y = Math.round((e.clientY - rect.top) / rect.height * (feed.naturalHeight || 480));
        send('select_target', { x, y });
    });

    feed.onload = () => { camDot.className = 'dot dot-green'; updateFraming(); };
    connectWS();
    </script>
</body>
</html>
