<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gimbal AI Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #16213e; flex-shrink: 0;
        }
        header h1 { font-size: 16px; font-weight: 600; }
        .status-bar { display: flex; gap: 12px; font-size: 12px; }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 3px;
        }
        .dot-green { background: #4ade80; }
        .dot-red { background: #f87171; }
        .dot-orange { background: #fb923c; }
        .dot-gray { background: #6b7280; }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Mode selector */
        .mode-bar {
            display: flex; gap: 8px; padding: 8px 16px;
            background: #0f172a; flex-shrink: 0;
        }
        .mode-btn {
            padding: 6px 14px; border: 1px solid #334155; border-radius: 6px;
            background: transparent; color: #94a3b8; font-size: 12px;
            cursor: pointer;
        }
        .mode-btn.active { background: #1e40af; border-color: #3b82f6; color: white; }

        /* Video area */
        .video-area {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .video-area video,
        .video-area img {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        .video-area canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #camera-preview {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        #processed-feed {
            cursor: crosshair;
            position: absolute; top: 0; left: 0;
            max-width: 100%; max-height: 100%; object-fit: contain;
            display: none;
        }

        .hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75); padding: 5px 12px;
            border-radius: 6px; font-size: 11px; color: #999;
        }

        /* Controls */
        .controls {
            display: flex; gap: 8px; padding: 10px 16px;
            background: #16213e; flex-shrink: 0;
            align-items: center; flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 16px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 500; cursor: pointer;
        }
        .btn-camera { background: #8b5cf6; color: white; }
        .btn-camera.active { background: #22c55e; }
        .btn-stop { background: #ef4444; color: white; }
        .btn-center { background: #3b82f6; color: white; }
        .state-badge {
            padding: 4px 10px; border-radius: 4px; font-size: 12px;
            font-weight: 600; margin-left: auto;
        }
        .state-idle { background: #374151; }
        .state-tracking { background: #166534; }
        .state-lost { background: #92400e; }

        .info { font-size: 11px; color: #64748b; padding: 0 4px; }
    </style>
</head>
<body>
    <header>
        <h1>Gimbal AI Tracker</h1>
        <div class="status-bar">
            <span><span class="dot dot-gray" id="cam-dot"></span>Camera</span>
            <span><span class="dot dot-gray" id="gimbal-dot"></span>Gimbal</span>
            <span><span class="dot dot-gray" id="track-dot"></span>Track</span>
            <span class="info" id="fps-info"></span>
        </div>
    </header>

    <div class="main">
        <div class="video-area" id="video-area">
            <!-- Hidden video element for camera preview / capture -->
            <video id="camera-preview" autoplay playsinline muted></video>
            <!-- Canvas for capturing frames to send -->
            <canvas id="capture-canvas" style="display:none;"></canvas>
            <!-- Processed video from server -->
            <img id="processed-feed" src="/video_feed" alt="Waiting for camera...">
            <div class="hint" id="hint">Start camera to begin</div>
        </div>

        <div class="controls">
            <button class="btn-camera" id="btn-camera" onclick="toggleCamera()">Start Camera</button>
            <button class="btn-stop" onclick="stopTracking()">Stop Track</button>
            <button class="btn-center" onclick="centerGimbal()">Center</button>
            <span class="state-badge state-idle" id="state-badge">IDLE</span>
        </div>
    </div>

    <script>
    // --- State ---
    let ws = null;
    let cameraStream = null;
    let sending = false;
    let sendInterval = null;

    const preview = document.getElementById('camera-preview');
    const captureCanvas = document.getElementById('capture-canvas');
    const processedFeed = document.getElementById('processed-feed');
    const btnCamera = document.getElementById('btn-camera');
    const hint = document.getElementById('hint');
    const camDot = document.getElementById('cam-dot');
    const gimbalDot = document.getElementById('gimbal-dot');
    const trackDot = document.getElementById('track-dot');
    const fpsInfo = document.getElementById('fps-info');
    const stateBadge = document.getElementById('state-badge');

    // --- WebSocket ---
    function connectWS() {
        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${wsProto}//${location.host}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            console.log('WS connected');
            // Start status polling
            setInterval(() => {
                if (ws.readyState === 1) {
                    ws.send(JSON.stringify({ action: 'get_status' }));
                }
            }, 500);
        };

        ws.onmessage = (e) => {
            if (typeof e.data === 'string') {
                const data = JSON.parse(e.data);
                if (data.event === 'status') {
                    updateStatus(data);
                } else if (data.event === 'target_selected') {
                    hint.textContent = data.success
                        ? 'Target locked! Tracking...'
                        : 'No person detected at that position';
                } else if (data.event === 'tracking_stopped') {
                    hint.textContent = 'Tracking stopped. Click a person to track.';
                }
            }
        };

        ws.onclose = () => {
            console.log('WS disconnected, reconnecting...');
            setTimeout(connectWS, 2000);
        };
    }

    function updateStatus(data) {
        const state = data.state || 'idle';
        stateBadge.textContent = state.toUpperCase();
        stateBadge.className = `state-badge state-${state}`;

        gimbalDot.className = `dot ${data.gimbal_connected ? 'dot-green' : 'dot-red'}`;
        trackDot.className = `dot ${
            state === 'tracking' ? 'dot-green' :
            state === 'lost' ? 'dot-orange' : 'dot-gray'
        }`;

        if (data.fps) fpsInfo.textContent = `${data.fps} FPS`;
    }

    // --- Camera ---
    async function toggleCamera() {
        if (cameraStream) {
            stopCamera();
            return;
        }

        try {
            // Request back camera on phones, any camera on desktop
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                },
                audio: false,
            });

            preview.srcObject = cameraStream;
            preview.setAttribute('autoplay', '');
            preview.setAttribute('playsinline', '');
            preview.setAttribute('muted', '');
            await preview.play();

            // Wait for video to actually produce frames
            await new Promise((resolve) => {
                const check = () => {
                    if (preview.videoWidth > 0 && preview.videoHeight > 0) {
                        resolve();
                    } else {
                        requestAnimationFrame(check);
                    }
                };
                check();
            });

            // Set up capture canvas to match actual video resolution
            captureCanvas.width = preview.videoWidth;
            captureCanvas.height = preview.videoHeight;

            hint.textContent = `Camera: ${preview.videoWidth}x${preview.videoHeight}. Connecting...`;

            btnCamera.textContent = 'Stop Camera';
            btnCamera.classList.add('active');
            camDot.className = 'dot dot-green';

            // Start sending frames to server
            startSending();

            // Once server starts processing, overlay processed feed
            processedFeed.onload = () => {
                if (cameraStream) {
                    processedFeed.style.display = 'block';
                    hint.textContent = 'AI active. Click on a person to track.';
                }
            };

        } catch (err) {
            console.error('Camera error:', err);
            hint.textContent = 'Camera access denied. Check permissions.';
            camDot.className = 'dot dot-red';
        }
    }

    function stopCamera() {
        stopSending();
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        preview.srcObject = null;
        processedFeed.style.display = 'none';
        btnCamera.textContent = 'Start Camera';
        btnCamera.classList.remove('active');
        camDot.className = 'dot dot-gray';
        hint.textContent = 'Camera stopped.';
    }

    function startSending() {
        if (sending) return;
        sending = true;
        const ctx = captureCanvas.getContext('2d');

        let framesSent = 0;

        function sendFrame() {
            if (!sending || !ws || ws.readyState !== 1 || !cameraStream) {
                if (sending) setTimeout(sendFrame, 100);
                return;
            }

            try {
                ctx.drawImage(preview, 0, 0, captureCanvas.width, captureCanvas.height);

                // Use dataURL approach (more compatible with iOS Safari)
                const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.6);
                // Strip the data:image/jpeg;base64, prefix and send as text
                ws.send(JSON.stringify({ action: 'frame', data: dataUrl }));

                framesSent++;
                if (framesSent <= 5 || framesSent % 30 === 0) {
                    hint.textContent = `Sending frames: ${framesSent}`;
                }
            } catch (err) {
                hint.textContent = `Frame error: ${err.message}`;
            }

            setTimeout(sendFrame, 100); // ~10 FPS
        }

        sendFrame();
    }

    function stopSending() {
        sending = false;
        if (sendInterval) {
            clearInterval(sendInterval);
            sendInterval = null;
        }
    }

    // --- Target selection ---
    document.getElementById('video-area').addEventListener('click', (e) => {
        if (!ws || ws.readyState !== 1) return;

        const img = processedFeed;
        const rect = img.getBoundingClientRect();

        // Map click to frame coordinates
        const scaleX = (img.naturalWidth || 640) / rect.width;
        const scaleY = (img.naturalHeight || 480) / rect.height;
        const x = Math.round((e.clientX - rect.left) * scaleX);
        const y = Math.round((e.clientY - rect.top) * scaleY);

        ws.send(JSON.stringify({ action: 'select_target', x, y }));
        hint.textContent = `Selecting target at (${x}, ${y})...`;
    });

    function stopTracking() {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ action: 'stop_tracking' }));
        }
    }

    function centerGimbal() {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ action: 'center' }));
        }
    }

    // --- Init ---
    connectWS();
    </script>
</body>
</html>
