<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimbal Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        :root {
            --bg-color: #08080c;
            --accent-color: #4f46e5;
            --secondary-accent: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-faded: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        header {
            text-align: center;
            width: 100%;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-faded);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background: var(--secondary-accent);
            box-shadow: 0 0 10px var(--secondary-accent);
        }

        #joystick-container {
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .control-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .control-btn:active,
        .control-btn.active {
            background: var(--accent-color);
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
        }

        .logs {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text-faded);
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .nipple {
            background: var(--accent-color) !important;
            opacity: 0.8 !important;
        }

        footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>DJI Gimbal Control</h1>
            <div class="status">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <div id="joystick-container"></div>

        <div class="logs" id="log-view">
            <div>Ready to connect...</div>
        </div>
    </div>

    <footer>Vibe Control System</footer>

    <script>
        const logView = document.getElementById('log-view');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function log(msg) {
            const entry = document.createElement('div');
            entry.textContent = `> ${msg}`;
            logView.prepend(entry);
            if (logView.children.length > 5) logView.removeChild(logView.lastChild);
        }

        // WS Setup
        let ws;
        function connect() {
            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = () => {
                log('WebSocket Connected');
                statusDot.classList.add('active');
                statusText.textContent = 'Gimbal Online';
            };

            ws.onerror = (e) => {
                log('WS Error');
            };

            ws.onclose = () => {
                log('WebSocket Closed. Retrying...');
                statusDot.classList.remove('active');
                statusText.textContent = 'Disconnected';
                setTimeout(connect, 2000);
            };
        }

        connect();

        // Joystick Setup
        const manager = nipplejs.create({
            zone: document.getElementById('joystick-container'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: '#4f46e5',
            size: 150
        });

        let currentDirection = 'stop';

        manager.on('move', (evt, data) => {
            if (!data.direction) return;

            // Map NippleJS direction to our expected strings
            let dir = data.direction.angle;

            if (currentDirection !== dir) {
                currentDirection = dir;
                sendMove(dir);
            }
        });

        manager.on('end', () => {
            log('Joystick released');
            currentDirection = 'stop';
            sendMove('stop');
        });

        function sendMove(direction) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const payload = { action: 'move', direction: direction };
                ws.send(JSON.stringify(payload));
                log(`SENT: ${direction.toUpperCase()}`);
            } else {
                log('WS NOT CONNECTED');
            }
        }

        // Handle window focus/blur for safety
        window.addEventListener('blur', () => {
            if (currentDirection !== 'stop') {
                currentDirection = 'stop';
                sendMove('stop');
            }
        });

    </script>
</body>

</html>
